name: CI

# revisa los tipos y compila el front cada vez que se sube algo a main, avance o final,
# y tambien en los pull requests hacia main
on:
  push:
    branches: [main, avance, final]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Compilar
        run: npm run build
