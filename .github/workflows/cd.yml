name: CD

# construye la imagen del front (nginx + front compilado), la sube a GitHub Container Registry
# y la despliega en Azure App Service, un ambiente por rama:
#   main   -> actual   (lo que tenemos ahora)
#   avance -> avance   (el avance intermedio)
#   final  -> final    (la entrega final)
# en cada ambiente de GitHub (Settings > Environments) van:
#   variable AZURE_WEBAPP_NAME
#   secreto  AZURE_WEBAPP_PUBLISH_PROFILE
on:
  push:
    branches: [main, avance, final]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'actual' || github.ref_name }}
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Entrar a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        id: imagen
        run: |
          DUENO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGEN="ghcr.io/${DUENO}/growlink-frontend:${{ github.ref_name }}"
          docker build -t "$IMAGEN" .
          docker push "$IMAGEN"
          echo "nombre=$IMAGEN" >> "$GITHUB_OUTPUT"

      # las URLs de los servicios y el puerto se configuran en la App Service (ver README)
      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ steps.imagen.outputs.nombre }}
