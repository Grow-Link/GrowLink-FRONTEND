# SonarCloud: que se analiza del front y como se mide su cobertura. Lo lee el paso "Analisis de SonarCloud" de
# ci.yml, que le pasa ademas la organizacion y la clave del proyecto (variables SONAR_ORGANIZATION y
# SONAR_PROJECT_KEY del repo, con los valores que pone SonarCloud al importarlo por defecto).

# Todo src/ se analiza (bugs, vulnerabilidades, codigo repetido), tambien las paginas y los componentes.
# Las pruebas y sus ayudas (src/pruebas/) van aparte como pruebas: un archivo no puede ser codigo y prueba a la vez,
# por eso salen de sonar.exclusions y entran en sonar.test.inclusions.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/pruebas/**
sonar.exclusions=src/**/*.test.ts,src/pruebas/**
sonar.sourceEncoding=UTF-8

# La cobertura sale del lcov que deja `npm run test:coverage` (ver vitest.config.ts)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Lo que NO cuenta para la cobertura (sigue analizandose, solo no se le pide cobertura): la presentacion y tres
# modulos que no son logica. ES LA MISMA LISTA que coverage.exclude en vitest.config.ts (ahi esta explicado cada
# uno): si se cambia una, se cambia la otra, para que el numero de SonarCloud y el de `npm run test:coverage` sean
# el mismo. store/ y hooks/ si cuentan.
sonar.coverage.exclusions=src/pages/**,src/components/**,src/App.tsx,src/main.tsx,src/utils/roadmapPdf.ts,src/utils/sonidos.ts,src/services/legalText.ts,src/**/*.d.ts
