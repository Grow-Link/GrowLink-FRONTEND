proxy_http_version 1.1;
proxy_set_header Host $proxy_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_ssl_server_name on;
# si una replica no contesta, se prueba con otra
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
# una replica que se acaba de caer no contesta ni rechaza la conexion, se queda esperando; con el valor
# por defecto (60 s) la primera peticion despues de la caida se quedaba colgada en vez de pasar a otra
proxy_connect_timeout 2s;
